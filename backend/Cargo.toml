[package]
name = "xdi-backend"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Backend of xdi-platform: API, SQL guard, analytics engine"
repository = "https://github.com/pgiahuy/xdi-platform"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# tls-rustls-ring-native-roots: TLS tới Postgres (nguồn database với sslmode require, verify-full, #230) bằng rustls và
# bộ mã hóa ring như reqwest, tin các CA của hệ thống (image Docker cài ca-certificates). Không cần OpenSSL.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "chrono", "json", "tls-rustls-ring-native-roots"] }
tower-http = { version = "0.7", features = ["fs"] }
argon2 = "0.6.0"
sha2 = "0.10"
deunicode = "1.6.2"
# Chuẩn hóa NFC chữ của câu hỏi và của hồ sơ cột trước khi so (service/ask/phrases.rs).
unicode-normalization = "0.1.26"
encoding_rs = "0.8.42"
axum-extra = { version = "0.12.6", features = ["cookie"] }
getrandom = "0.4"
time = { version = "0.3", default-features = false }
duckdb = { version = "1.10506", features = ["bundled", "parquet"] }
calamine = { version = "0.37", features = ["dates"] }
# Chỉ để đọc kích thước giải nén trong file xlsx trước khi calamine mở nó; cùng bản và feature calamine dùng.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Trần RAM và thời gian CPU cho tiến trình con đọc file Excel (engine/excel_worker.rs).
rlimit = "0.11"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
# Gọi Gemini và Ollama (engine/llm/http.rs). TLS bằng rustls với bộ mã hóa ring: không cần OpenSSL của hệ thống, và
# không kéo aws-lc, bộ mã hóa mặc định của reqwest 0.13, thêm một thư viện C lớn phải biên dịch.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls ={ version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sqlparser = { version = "0.63", features = ["visitor"] }
# Số thập phân chính xác cho phân rã câu "tại sao" (service/explain/mod.rs): cộng trừ không qua f64. Tắt mặc định để không
# kéo serde cho Decimal; số ra JSON là chuỗi do code dựng.
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
# Mã hóa thông tin kết nối của nguồn database trước khi lưu (service/sources/secret.rs); khóa đọc từ SOURCE_SECRET_KEY
# dạng base64.
aes-gcm = "0.10"
base64 = "0.22"
# Đọc luồng COPY ... TO STDOUT khi chụp bảng Postgres (service/sources/postgres.rs).
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rust_xlsxwriter = "0.101"
# Đưa log của reqwest và hyper (crate log) vào bộ đệm của test kiểm khóa API không lọt vào log.
tracing-log = "0.2"

# DuckDB biên dịch từ mã C++ kèm trong crate. Bản debug kèm thông tin debug của C++ nặng hơn 2 GB mỗi lần build, làm
# đầy đĩa của runner CI; thông tin đó không giúp debug code của dự án, nên tắt riêng cho crate này.
[profile.dev.package.libduckdb-sys]
debug = false

[package]
name = "xdi-backend"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Backend of xdi-platform: API, SQL guard, analytics engine"
repository = "https://github.com/pgiahuy/xdi-platform"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
tower-http = { version = "0.7", features = ["fs"] }
argon2 = "0.6.0"
sha2 = "0.10"
deunicode = "1.6.2"
axum-extra = { version = "0.12.6", features = ["cookie"] }
getrandom = "0.4"
time = { version = "0.3", default-features = false }
duckdb = { version = "1.10506", features = ["bundled", "parquet"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

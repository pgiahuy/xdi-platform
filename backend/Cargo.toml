[package]
name = "xdi-backend"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Backend of xdi-platform: API, SQL guard, analytics engine"
repository = "https://github.com/pgiahuy/xdi-platform"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

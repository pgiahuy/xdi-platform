# docker-image.yml - build image backend để chắc Dockerfile còn build được, chạy tay (tab Actions, Run workflow). Không
# chạy trên mỗi PR để tiết kiệm phút Actions; nên chạy khi đổi backend/Dockerfile, file compose, .dockerignore, khi thêm
# crate hay gói npm cần thư viện hệ thống, và trước khi tag. Image không được đẩy đi đâu; đẩy lên GHCR là việc của
# release.yml khi đẩy tag v*.
name: Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

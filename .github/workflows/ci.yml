# ci.yml - chạy trên mỗi PR và push lên main. Job backend và frontend chỉ gọi Makefile. Cả ba job luôn chạy để check
# luôn có kết quả (ruleset yêu cầu), nhưng chỉ làm việc nặng khi file liên quan đổi: repo riêng tư có hạn mức phút
# Actions mỗi tháng. Trên PR, job làm việc khi PR đổi phần của nó. Khi push lên main, PR đã xanh trước khi merge, nên
# job chỉ chạy lại khi đổi thứ quyết định cache (Cargo.lock, package-lock), để cache trên main mới cho các PR sau
# dùng lại. Build image Docker không chạy ở đây, xem job docker.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Postgres thật cho test migration; cùng image với compose.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: xdi
          POSTGRES_PASSWORD: xdi
          POSTGRES_DB: xdi
        ports:
          - 5432:5432
        # --health-cmd luôn chạy qua sh; exec để sh nhường chỗ cho pg_isready, không để pg_isready mồ côi dưới
        # postgres khi healthcheck quá timeout (giải thích ở docker-compose.yml).
        options: >-
          --health-cmd "exec pg_isready -U xdi -d xdi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://xdi:xdi@localhost:5432/xdi
    # paths-filter đọc danh sách file của PR qua API nên cần quyền đọc pull request.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              # Gói khái niệm ngành được build.rs nhúng vào backend; PR chỉ sửa gói vẫn phải chạy test.
              - 'data/domains/**'
              # Bộ đánh giá câu hỏi mẫu và dữ liệu mẫu của nó (#37), kể cả database mẫu mà make eval chụp (#230).
              - 'eval/**'
              - 'data/samples/**'
              - 'data/demo-db/**'
              - 'data/postgres-demo/**'
              - 'docker-compose.yml'
              # Test so openapi.json và response mẫu của ask với code.
              - 'openapi.json'
              - 'frontend/src/api/examples/**'
              - 'Makefile'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            deps:
              - 'backend/Cargo.toml'
              - 'backend/Cargo.lock'
              - '.github/workflows/ci.yml'
      - id: work
        name: Decide whether to build
        run: echo "run=${{ (github.event_name == 'pull_request' && steps.changes.outputs.backend == 'true') || (github.event_name == 'push' && steps.changes.outputs.deps == 'true') }}" >> "$GITHUB_OUTPUT"
      # Thư mục target (bản clippy và bản test, DuckDB biên dịch từ C++) cộng cache khôi phục từ main đã làm đầy đĩa
      # runner (còn 99 MB, "No space left on device" khi ghi libduckdb.a). Xóa các bộ công cụ có sẵn trên image mà
      # project không dùng (.NET, Android, Haskell, CodeQL) để lấy lại khoảng 20 GB.
      - if: steps.work.outputs.run == 'true'
        name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - if: steps.work.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: steps.work.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - if: steps.work.outputs.run == 'true'
        run: make check-fast
      # make eval tự chạy dịch vụ demo-db của docker-compose.yml (database mẫu nhỏ) để chụp bảng như bản cài mới.
      - if: steps.work.outputs.run == 'true'
        run: make eval

  frontend:
    # Luôn chạy để check "frontend" có kết quả; chỉ cài Node và build khi đổi frontend/ (trên PR hay khi push lên main).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              # Đổi API thì openapi.json đổi; check-frontend kiểm schema.ts sinh từ nó còn khớp không.
              - 'openapi.json'
              - 'Makefile'
              - '.github/workflows/ci.yml'
      - if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          # react-router trong package-lock cần Node 22.22 trở lên (Vite 8 cần 20.19 hoặc 22.12).
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.changes.outputs.frontend == 'true'
        run: make check-frontend

  docker:
    # Giữ job này vì ruleset yêu cầu check "docker", nhưng không build image ở đây nữa: build image tốn nhiều phút
    # Actions nhất (DuckDB biên dịch từ C++), trong khi code đã được job backend và frontend biên dịch. Build image chạy
    # tay bằng workflow docker-image.yml (tab Actions, Run workflow), nên chạy trước khi tag; Release cũng build image
    # thật khi đẩy tag v*.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q

# ci.yml - chạy trên mỗi PR và push lên main. Job backend chỉ gọi Makefile; job docker có thêm bước lọc theo file
# thay đổi và cache layer, vì hai việc đó chỉ có nghĩa trên CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: make check-fast

  docker:
    # Job luôn chạy để check "docker" luôn có kết quả (ruleset yêu cầu check này);
    # chỉ build khi PR đổi code hoặc compose, để PR chỉ sửa tài liệu không tốn phút CI.
    runs-on: ubuntu-latest
    # paths-filter đọc danh sách file của PR qua API nên cần quyền đọc pull request.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            image:
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
      - name: Validate compose file
        run: docker compose config -q
      - if: steps.changes.outputs.image == 'true' || github.event_name == 'push'
        uses: docker/setup-buildx-action@v3
      - if: steps.changes.outputs.image == 'true' || github.event_name == 'push'
        name: Build backend image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

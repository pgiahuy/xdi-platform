# ci.yml - chạy trên mỗi PR và push lên main. Job backend và frontend chỉ gọi Makefile; job frontend và docker có
# thêm bước lọc theo file thay đổi và cache, vì hai việc đó chỉ có nghĩa trên CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Postgres thật cho test migration; cùng image với compose.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: xdi
          POSTGRES_PASSWORD: xdi
          POSTGRES_DB: xdi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdi -d xdi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://xdi:xdi@localhost:5432/xdi
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: make check-fast

  frontend:
    # Như job docker: luôn chạy để check "frontend" luôn có kết quả, nhưng chỉ cài Node và build khi PR đổi frontend/.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              # Đổi API thì openapi.json đổi; check-frontend kiểm schema.ts sinh từ nó còn khớp không.
              - 'openapi.json'
              - 'Makefile'
              - '.github/workflows/ci.yml'
      - if: steps.changes.outputs.frontend == 'true' || github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          # Vite 8 cần Node 20.19 hoặc 22.12 trở lên.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.changes.outputs.frontend == 'true' || github.event_name == 'push'
        run: make check-frontend

  docker:
    # Job luôn chạy để check "docker" luôn có kết quả (ruleset yêu cầu check này).
    # Trên PR chỉ build image khi đổi file quyết định cách build: code đã được job backend và frontend biên dịch, build
    # lại trong Docker chỉ thêm vài phút chờ. Push lên main luôn build, để bắt lỗi còn sót và giữ cache mới.
    runs-on: ubuntu-latest
    # paths-filter đọc danh sách file của PR qua API nên cần quyền đọc pull request.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            image:
              - 'backend/Dockerfile'
              - 'backend/Cargo.toml'
              - 'backend/Cargo.lock'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'docker-compose*.yml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
      - name: Validate compose file
        run: docker compose config -q
      - if: steps.changes.outputs.image == 'true' || github.event_name == 'push'
        uses: docker/setup-buildx-action@v3
      - if: steps.changes.outputs.image == 'true' || github.event_name == 'push'
        name: Build backend image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

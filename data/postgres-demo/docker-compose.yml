# data/postgres-demo/docker-compose.yml - một Postgres 17 riêng chứa hai cơ sở dữ liệu mẫu: "sales_demo" (DataCo) và
# "edu_demo" (OULAD), tách thành nhiều bảng có khóa chính, khóa ngoại, để thử tính năng kết nối cơ sở dữ liệu của công ty.
# Tách khỏi docker-compose.yml ở gốc repo: Postgres của ứng dụng chứa dữ liệu ứng dụng, còn container này đóng vai
# cơ sở dữ liệu bên ngoài mà ứng dụng chỉ đọc. Dữ liệu nạp bằng load.sh, xem README.md cùng thư mục.

name: xdi-demo-db

services:
  demo-db:
    image: postgres:17
    # Đổi tên bằng DEMO_DB_CONTAINER (cùng biến với docker-compose.yml ở gốc) khi cần một bản thứ hai bên cạnh bản đang
    # chạy, ví dụ để thử trên volume trống: COMPOSE_PROJECT_NAME=khac DEMO_DB_CONTAINER=khac-demo-db DEMO_DB_PORT=5441.
    container_name: ${DEMO_DB_CONTAINER:-xdi-demo-db}
    # Cùng lý do như docker-compose.yml ở gốc: tiến trình init nhỏ làm PID 1 để tiến trình mồ côi không làm Postgres
    # khởi động lại.
    init: true
    environment:
      # Mật khẩu mẫu, chỉ để chạy trên máy. Người dùng chỉ đọc "analyst" tạo trong init/01_roles.sql.
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-demo}
      # Không cho image tạo database dữ liệu: load.sh tạo sales_demo và edu_demo, chạy được cả trên volume đã có từ
      # trước (khi đó image không chạy lại bước khởi tạo).
      POSTGRES_DB: postgres
    ports:
      # Chỉ mở trên localhost. Cổng 5440 để không đụng Postgres của ứng dụng (5433) hay Postgres cài sẵn (5432).
      - "127.0.0.1:${DEMO_DB_PORT:-5440}:5432"
    volumes:
      - demo-db-data:/var/lib/postgresql/data
      # Chỉ chạy một lần, khi volume còn trống.
      - ./init:/docker-entrypoint-initdb.d:ro
      # CSV nguồn, chỉ đọc. load.sh chạy psql trong container nên máy chủ không cần cài psql.
      - ${DEMO_DATA_DIR:-../downloads}:/downloads:ro
    healthcheck:
      # -h 127.0.0.1: hỏi qua TCP. Lần chạy đầu, image chạy init/ trên một máy chủ tạm chỉ mở unix socket; không có -h
      # thì pg_isready báo sẵn sàng ngay lúc đó và load.sh có thể chạy trước khi init/ xong.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "demo", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Giao diện web để xem bảng khi trình diễn. Chỉ chạy khi bật profile: docker compose --profile adminer up -d.
  # load.sh chỉ gọi dịch vụ demo-db nên không kéo Adminer lên. Đăng nhập bằng analyst (chỉ đọc), xem README.md.
  adminer:
    image: adminer:5.4.1
    container_name: xdi-demo-adminer
    profiles: ["adminer"]
    environment:
      # Điền sẵn ô "Server" bằng tên dịch vụ Postgres trong mạng của compose này.
      ADMINER_DEFAULT_SERVER: demo-db
    ports:
      # Chỉ mở trên localhost, như cổng Postgres.
      - "127.0.0.1:${DEMO_ADMINER_PORT:-8090}:8080"
    depends_on:
      demo-db:
        condition: service_healthy

  # Màn xem nhanh dữ liệu của sales_demo và edu_demo (Flask-Admin, admin/app.py), để đối chiếu số ứng dụng trả lời
  # với dòng dữ liệu gốc khi trình diễn. Chỉ đọc hai lớp: kết nối bằng analyst (chỉ SELECT), mọi trang tắt thêm, sửa,
  # xóa. Chỉ chạy khi bật profile: docker compose -f data/postgres-demo/docker-compose.yml --profile admin up -d --build
  admin:
    profiles: ["admin"]
    build: ./admin
    container_name: xdi-demo-admin
    environment:
      # Máy chủ không kèm database; danh sách database cách nhau bằng dấu phẩy, mỗi database một nhóm trên menu.
      DEMO_SERVER_URL: postgresql+psycopg://analyst:analyst@demo-db:5432
      DEMO_DATABASES: sales_demo,edu_demo
    ports:
      # Chỉ mở trên localhost, như cổng Postgres.
      - "127.0.0.1:${DEMO_ADMIN_PORT:-8091}:8091"
    depends_on:
      demo-db:
        condition: service_healthy

volumes:
  demo-db-data:

# docker-compose.yml - hai dịch vụ: postgres, backend. Backend phục vụ cả API (/api) và giao diện, một cổng.
# Mặc định chạy không cần khóa ngoài: LLM_PROVIDER=mock. Đổi trong .env.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: xdi
      POSTGRES_PASSWORD: xdi
      POSTGRES_DB: xdi
    ports:
      # Cổng host mặc định 5433 để không đụng Postgres cài sẵn trên máy dev.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xdi -d xdi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      # Gốc repo, vì image build cả frontend/.
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      DATABASE_URL: postgres://xdi:xdi@postgres:5432/xdi
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      RUST_LOG: ${RUST_LOG:-info}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    # Cho backend gọi Ollama chạy trên máy host, kể cả trên Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Named volume: user không phải root trong container ghi được; dữ liệu còn sau khi down (mất khi down -v).
      - xdidata:/data
      - ./data/samples:/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${BACKEND_PORT:-8000}/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  xdidata:

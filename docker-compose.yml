# docker-compose.yml - ba dịch vụ: postgres, backend, frontend (frontend thêm khi có).
# Mặc định chạy không cần khóa ngoài: LLM_PROVIDER=mock. Đổi trong .env.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: xdi
      POSTGRES_PASSWORD: xdi
      POSTGRES_DB: xdi
    ports:
      # Cổng host mặc định 5433 để không đụng Postgres cài sẵn trên máy dev.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xdi -d xdi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      BACKEND_PORT: 8000
      DATABASE_URL: postgres://xdi:xdi@postgres:5432/xdi
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-doi-gia-tri-nay-truoc-khi-dua-ra-ngoai}
      RUST_LOG: ${RUST_LOG:-info}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

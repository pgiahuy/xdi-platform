# docker-compose.yml - ba dịch vụ: postgres (dữ liệu của ứng dụng), demo-db (database mẫu nhiều bảng, đóng vai database
# của tổ chức), backend. Backend phục vụ cả API (/api) và giao diện, một cổng.
# Mặc định chạy không cần khóa ngoài: LLM_PROVIDER=mock. Đổi trong .env.
# Bản chạy thật đè thêm docker-compose.prod.yml (docs/INSTALL.md mục 3).

services:
  postgres:
    image: pgvector/pgvector:pg17
    # Tiến trình init nhỏ của Docker làm PID 1 thay cho postgres. Trong container, tiến trình mồ côi (ví dụ lệnh còn
    # chạy sau khi `docker exec` hay healthcheck bị cắt) được gán cho PID 1. Nếu PID 1 là postgres thì tiến trình lạ
    # đó thoát mã khác 0 và 1 bị coi là tiến trình con sập: Postgres cắt mọi kết nối và khởi động lại.
    init: true
    environment:
      POSTGRES_USER: xdi
      # Mật khẩu mẫu, chỉ để chạy trên máy. Bản chạy thật bắt buộc đặt POSTGRES_PASSWORD (docker-compose.prod.yml).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xdi}
      POSTGRES_DB: xdi
    ports:
      # Cổng host mặc định 5433 để không đụng Postgres cài sẵn trên máy dev.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Gọi thẳng, không qua sh: sh của image fork pg_isready, healthcheck quá timeout thì Docker chỉ giết sh, còn
      # pg_isready mồ côi rồi thoát mã 2 khi Postgres chậm trả lời (đĩa nghẽn).
      test: ["CMD", "pg_isready", "-U", "xdi", "-d", "xdi"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Database mẫu nhỏ "company_demo" (data/demo-db/README.md): schema sales (từ data/samples/dataco.csv) và edu (bản nhỏ
  # của OULAD trong data/samples/oulad/), tách bảng có khóa ngoại như data/postgres-demo. Nạp một lần khi volume trống,
  # bằng file init; không cần tải gì thêm. Thiết lập lần đầu kết nối vào đây bằng tài khoản chỉ đọc analyst và chụp
  # bảng thành dataset (SAMPLE_DATABASE_URL của backend). Cùng image với postgres để bản cài mới chỉ tải một image.
  demo-db:
    image: pgvector/pgvector:pg17
    # Cùng lý do như postgres ở trên.
    init: true
    environment:
      # Mật khẩu mẫu của người dùng chủ, chỉ dùng trong file init. Ứng dụng dùng analyst (chỉ SELECT).
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-demo}
      POSTGRES_DB: company_demo
    ports:
      # Chỉ mở trên localhost, cho make dev và make eval chạy backend ngoài Docker. Backend trong compose nối qua mạng
      # riêng (demo-db:5432).
      - "127.0.0.1:${DEMO_DB_PORT:-5434}:5432"
    volumes:
      - demodata:/var/lib/postgresql/data
      - ./data/postgres-demo/init/01_roles.sql:/docker-entrypoint-initdb.d/01_roles.sql:ro
      - ./data/demo-db/init/02_load.sh:/docker-entrypoint-initdb.d/02_load.sh:ro
      - ./data/postgres-demo/sql:/demo-sql:ro
      - ./data/samples:/samples:ro
    healthcheck:
      # -h 127.0.0.1: hỏi qua TCP. Lúc chạy file init, image mở một máy chủ tạm chỉ nghe unix socket; không có -h thì
      # pg_isready báo sẵn sàng trước khi nạp xong.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "demo", "-d", "company_demo"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      # Gốc repo, vì image build cả frontend/.
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Giới hạn số tiến trình biên dịch khi máy ít RAM (docs/INSTALL.md mục 6). Để trống: mọi nhân.
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-default}
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      DATABASE_URL: postgres://xdi:${POSTGRES_PASSWORD:-xdi}@postgres:5432/xdi
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      DB_ACQUIRE_TIMEOUT_SECS: ${DB_ACQUIRE_TIMEOUT_SECS:-5}
      PUBLIC_URL: ${PUBLIC_URL:-}
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      RUST_LOG: ${RUST_LOG:-info}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECS: ${GEMINI_TIMEOUT_SECS:-60}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      OLLAMA_TIMEOUT_SECS: ${OLLAMA_TIMEOUT_SECS:-300}
      CLASSIFY_TIMEOUT_SECS: ${CLASSIFY_TIMEOUT_SECS:-15}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-12288}
      QUERY_TIMEOUT_SECS: ${QUERY_TIMEOUT_SECS:-30}
      ASK_MAX_ROWS: ${ASK_MAX_ROWS:-100000}
      SEED_SAMPLE: ${SEED_SAMPLE:-true}
      # Database mẫu mà thiết lập lần đầu thêm làm nguồn và chụp bảng (data/README.md). Đặt rỗng trong .env
      # (SAMPLE_DATABASE_URL=) để nạp data/samples/dataco.csv như trước.
      SAMPLE_DATABASE_URL: ${SAMPLE_DATABASE_URL-postgres://analyst:analyst@demo-db:5432/company_demo}
      ANSWER_TEXT: ${ANSWER_TEXT:-true}
      INSIGHT_TEXT: ${INSIGHT_TEXT:-true}
      # Nguồn database (docs/DATA.md): khóa trống thì backend sinh một khóa và lưu ở /data/source_secret.key (volume
      # xdidata); danh sách máy chủ trống thì không thêm được nguồn (máy của SAMPLE_DATABASE_URL luôn được phép).
      SOURCE_SECRET_KEY: ${SOURCE_SECRET_KEY:-}
      SOURCE_ALLOWED_HOSTS: ${SOURCE_ALLOWED_HOSTS:-}
      SOURCE_MAX_ROWS: ${SOURCE_MAX_ROWS:-1000000}
      SOURCE_TIMEOUT_SECS: ${SOURCE_TIMEOUT_SECS:-300}
      # Cố định, không lấy từ .env: dataset mẫu nằm ở volume chỉ đọc bên dưới.
      SAMPLES_DIR: /samples
    ports:
      - "${BACKEND_BIND:+${BACKEND_BIND}:}${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    # Cho backend gọi Ollama chạy trên máy host, kể cả trên Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Named volume: user không phải root trong container ghi được; dữ liệu còn sau khi down (mất khi down -v).
      - xdidata:/data
      - ./data/samples:/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Chờ database mẫu nạp xong để thiết lập lần đầu chụp được bảng. required: false để bản chạy thật tắt demo-db
      # (docker-compose.prod.yml) mà backend vẫn chạy.
      demo-db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${BACKEND_PORT:-8000}/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  demodata:
  xdidata:
